<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codrive — Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-elevated: #FCFCFD; --surface-hover: #F0F0F1;
    --border: #E4E4E7; --border-strong: #D4D4D8;
    --text-primary: #18181B; --text-secondary: #52525B; --text-muted: #A1A1AA;
    --accent: #2F8F6E; --accent-hover: #267A5D; --accent-tint: rgba(47, 143, 110, 0.09);
    --warning: #B5790C; --warning-tint: rgba(181, 121, 12, 0.1);
    --overlay: rgba(24, 24, 27, 0.35);
    --shadow-lg: 0 16px 50px rgba(24, 24, 27, 0.22);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="dark"] {
    --bg: #121214; --surface: #1B1B1E; --surface-elevated: #19191C; --surface-hover: #26262A;
    --border: #2C2C30; --border-strong: #38383D;
    --text-primary: #F2F2F3; --text-secondary: #A6A6AC; --text-muted: #6B6B70;
    --accent: #3DB98A; --accent-hover: #4FCB9C; --accent-tint: rgba(61, 185, 138, 0.13);
    --warning: #D8A23F; --warning-tint: rgba(216, 162, 63, 0.14);
    --overlay: rgba(0, 0, 0, 0.55);
    --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; height: 100vh; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .host { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .host h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .host p { color: var(--text-secondary); font-size: 13.5px; }
  .open-search-btn { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border: 1px solid var(--border-strong); border-radius: 9px; background: var(--surface); color: var(--text-muted); font-size: 13.5px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .open-search-btn:hover { background: var(--surface-hover); }
  .open-search-btn svg { width: 15px; height: 15px; }
  .open-search-btn kbd { margin-left: 30px; font-family: var(--font-mono); font-size: 11px; background: var(--surface-hover); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; color: var(--text-muted); }
  .icon-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--text-secondary); border: 1px solid var(--border); background: var(--surface); }
  .icon-btn:hover { background: var(--surface-hover); }
  .icon-btn svg { width: 16px; height: 16px; }
  .overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; opacity: 0; pointer-events: none; transition: opacity 0.14s ease; }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .palette { width: 560px; max-width: calc(100vw - 32px); max-height: 60vh; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; display: flex; flex-direction: column; transform: translateY(-8px) scale(0.98); transition: transform 0.14s ease; }
  .overlay.open .palette { transform: translateY(0) scale(1); }
  .search-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .search-input-row svg { width: 17px; height: 17px; color: var(--text-muted); flex-shrink: 0; }
  #search-input { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; color: var(--text-primary); }
  .esc-hint { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); background: var(--surface-hover); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; }
  .results { flex: 1; overflow-y: auto; padding: 6px; }
  .group-label { font-size: 10.5px; font-weight: 600; color: var(--text-muted); padding: 10px 10px 4px; }
  .result-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .result-row.selected { background: var(--accent-tint); }
  .result-icon { width: 26px; height: 26px; border-radius: 6px; background: var(--surface-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .result-row.selected .result-icon { background: var(--surface); }
  .result-icon svg { width: 13px; height: 13px; stroke: var(--text-secondary); }
  .result-row.selected .result-icon svg { stroke: var(--accent); }
  .result-text { flex: 1; min-width: 0; }
  .result-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .result-title mark { background: var(--warning-tint); color: var(--text-primary); border-radius: 2px; }
  .result-sub { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
  .result-type { font-size: 10.5px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; flex-shrink: 0; }
  .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 13px; }
  .palette-footer { display: flex; align-items: center; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); flex-shrink: 0; font-size: 11px; color: var(--text-muted); }
  .palette-footer kbd { font-family: var(--font-mono); background: var(--surface-hover); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>

<div class="host">
  <h1>Codrive</h1>
  <p>Press <strong>⌘K</strong> or click below to search.</p>
  <button class="open-search-btn" id="open-search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    Search languages and concepts...<kbd>⌘K</kbd>
  </button>
  <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme" style="margin-top: 6px;"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <p id="status-line" style="font-size: 11.5px; color: var(--text-muted);"></p>
</div>

<div class="overlay" id="overlay">
  <div class="palette">
    <div class="search-input-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search-input" type="text" placeholder="Search languages and concepts..." autocomplete="off">
      <span class="esc-hint">ESC</span>
    </div>
    <div class="results" id="results"></div>
    <div class="palette-footer"><span><kbd>↑</kbd><kbd>↓</kbd> Navigate</span><span><kbd>↵</kbd> Open</span><span><kbd>ESC</kbd> Close</span></div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_BASE = window.CODRIVE_CONFIG.apiBase;
  const Api = (() => {
    let accessToken = null, currentUser = null;
    async function request(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
      const res = await fetch(API_BASE + path, { ...options, headers, credentials: 'include' });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function getSession() {
      if (currentUser) return currentUser;
      const data = await request('/auth/refresh', { method: 'POST' });
      accessToken = data.accessToken; currentUser = data.user;
      return currentUser;
    }
    async function getLanguages() { return (await request('/languages')).languages; }
    async function getConceptsByCategory(slug, cat) { return (await request(`/concepts/${slug}/${cat}`)).concepts; }
    async function getBookmarks() { return (await request('/bookmarks')).bookmarks; }
    async function addBookmark(targetType, targetId, title, sub) { return request('/bookmarks', { method: 'POST', body: JSON.stringify({ targetType, targetId, title, sub }) }); }
    async function removeBookmark(id) { return request('/bookmarks/' + id, { method: 'DELETE' }); }
    return { getSession, getLanguages, getConceptsByCategory, getBookmarks, addBookmark, removeBookmark };
  })();

  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonPath = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  function applyTheme(t) { root.setAttribute('data-theme', t); icon.innerHTML = t === 'dark' ? moonPath : sunPath; }
  { const saved = localStorage.getItem('codrive-theme'); applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); }
  toggle.addEventListener('click', () => { const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(next); localStorage.setItem('codrive-theme', next); });

  const icons = {
    language: '<path d="M9 18l6-6-6-6"/><path d="M4 6h1M4 12h1M4 18h1"/>',
    concept: '<path d="M4 19.5A2.5 2.5 0 016.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>'
  };

  let index = [];         // built from the real API on first open
  let bookmarkedKeys = new Map(); // "concept:<id>" -> bookmark _id, refreshed each open
  let indexLoaded = false;
  let currentResults = [];
  let selectedIndex = 0;

  async function buildIndex() {
    const session = await Api.getSession();
    if (!session) throw new Error('not signed in');
    const languages = await Api.getLanguages();
    const entries = [];
    for (const lang of languages) {
      entries.push({ type: 'language', title: lang.name, sub: `${lang.categories.length} categor${lang.categories.length === 1 ? 'y' : 'ies'}` });
      for (const cat of lang.categories) {
        const concepts = await Api.getConceptsByCategory(lang.slug, cat.slug);
        concepts.forEach(c => entries.push({ type: 'concept', title: c.title, sub: `${lang.name} · ${cat.name}`, id: c._id }));
      }
    }
    return entries;
  }

  async function refreshBookmarkState() {
    try {
      const bookmarks = await Api.getBookmarks();
      bookmarkedKeys = new Map(bookmarks.map(b => [`${b.targetType}:${b.targetId}`, b._id]));
    } catch (e) { bookmarkedKeys = new Map(); }
  }

  function highlight(text, query) {
    if (!query) return text;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return text;
    return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + query.length) + '</mark>' + text.slice(idx + query.length);
  }

  function renderResults(query) {
    const q = query.trim().toLowerCase();
    currentResults = q ? index.filter(item => item.title.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q)) : index.slice(0, 10);
    selectedIndex = 0;

    if (currentResults.length === 0) {
      document.getElementById('results').innerHTML = `<div class="empty-state">No results for "${query}"</div>`;
      return;
    }
    const groups = {};
    currentResults.forEach((item, i) => { (groups[item.type] = groups[item.type] || []).push({ ...item, i }); });
    const labels = { language: 'Languages', concept: 'Concepts' };
    let html = '';
    Object.entries(groups).forEach(([type, items]) => {
      html += `<div class="group-label">${labels[type]}</div>`;
      items.forEach(item => {
        const isBookmarked = item.type === 'concept' && bookmarkedKeys.has(`concept:${item.id}`);
        html += `<div class="result-row${item.i === selectedIndex ? ' selected' : ''}" data-index="${item.i}">
            <span class="result-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[item.type]}</svg></span>
            <span class="result-text"><div class="result-title">${highlight(item.title, query)}</div><div class="result-sub">${item.sub}</div></span>
            <span class="result-type">${item.type}</span>
            ${item.type === 'concept' ? `<button class="result-bookmark-btn" data-id="${item.id}" data-title="${item.title}" data-sub="${item.sub}" aria-label="Toggle bookmark" style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:5px;flex-shrink:0;color:${isBookmarked ? 'var(--accent)' : 'var(--text-muted)'};">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg>
            </button>` : ''}
          </div>`;
      });
    });
    document.getElementById('results').innerHTML = html;

    document.querySelectorAll('.result-row').forEach(row => {
      row.addEventListener('mouseenter', () => { selectedIndex = parseInt(row.dataset.index); updateSelection(); });
      row.addEventListener('click', (e) => { if (!e.target.closest('.result-bookmark-btn')) closePalette(); });
    });
    document.querySelectorAll('.result-bookmark-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = `concept:${btn.dataset.id}`;
        try {
          if (bookmarkedKeys.has(key)) { await Api.removeBookmark(bookmarkedKeys.get(key)); }
          else { const res = await Api.addBookmark('concept', btn.dataset.id, btn.dataset.title, btn.dataset.sub); bookmarkedKeys.set(key, res.bookmark._id); }
          await refreshBookmarkState();
          renderResults(searchInput.value);
        } catch (e) { /* not signed in or API down — button just won't toggle */ }
      });
    });
  }

  function updateSelection() {
    document.querySelectorAll('.result-row').forEach(row => row.classList.toggle('selected', parseInt(row.dataset.index) === selectedIndex));
    const sel = document.querySelector('.result-row.selected');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  const overlay = document.getElementById('overlay');
  const searchInput = document.getElementById('search-input');

  async function openPalette() {
    overlay.classList.add('open');
    searchInput.value = '';
    searchInput.focus();
    if (!indexLoaded) {
      document.getElementById('results').innerHTML = `<div class="empty-state">Loading catalog…</div>`;
      try { index = await buildIndex(); indexLoaded = true; }
      catch (e) { document.getElementById('results').innerHTML = `<div class="empty-state">Couldn't load the catalog — sign in and make sure the backend is running.</div>`; return; }
    }
    await refreshBookmarkState();
    renderResults('');
  }
  function closePalette() { overlay.classList.remove('open'); }

  document.getElementById('open-search').addEventListener('click', openPalette);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closePalette(); });
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); overlay.classList.contains('open') ? closePalette() : openPalette(); return; }
    if (!overlay.classList.contains('open')) return;
    if (e.key === 'Escape') { closePalette(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); selectedIndex = Math.min(selectedIndex + 1, currentResults.length - 1); updateSelection(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIndex = Math.max(selectedIndex - 1, 0); updateSelection(); }
    else if (e.key === 'Enter') { e.preventDefault(); closePalette(); }
  });
  searchInput.addEventListener('input', () => renderResults(searchInput.value));

  (async () => {
    try { await Api.getSession(); document.getElementById('status-line').textContent = ''; }
    catch (e) { document.getElementById('status-line').textContent = 'Not signed in — sign in first for search to load the real catalog.'; }
  })();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codrive — Languages</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-elevated: #FCFCFD; --surface-hover: #F0F0F1;
    --border: #E4E4E7; --border-strong: #D4D4D8;
    --text-primary: #18181B; --text-secondary: #52525B; --text-muted: #A1A1AA;
    --accent: #2F8F6E; --accent-hover: #267A5D; --accent-tint: rgba(47, 143, 110, 0.09);
    --warning: #B5790C; --success: #2F8F6E; --danger: #C0433C;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="dark"] {
    --bg: #121214; --surface: #1B1B1E; --surface-elevated: #19191C; --surface-hover: #26262A;
    --border: #2C2C30; --border-strong: #38383D;
    --text-primary: #F2F2F3; --text-secondary: #A6A6AC; --text-muted: #6B6B70;
    --accent: #3DB98A; --accent-hover: #4FCB9C; --accent-tint: rgba(61, 185, 138, 0.13);
    --warning: #D8A23F; --success: #3DB98A; --danger: #DB6B64;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { height: 52px; flex-shrink: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--surface-elevated); }
  .topbar h1 { font-size: 14.5px; font-weight: 600; }
  .icon-btn { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-secondary); }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
  .icon-btn svg { width: 16px; height: 16px; }
  .body { flex: 1; display: flex; min-height: 0; }
  .lang-rail { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 14px 10px; background: var(--surface-elevated); }
  .rail-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 2px; }
  .rail-item:hover { background: var(--surface-hover); }
  .rail-item.active { background: var(--accent-tint); color: var(--accent); }
  .rail-item .rail-pct { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .rail-item.active .rail-pct { color: var(--accent); }
  .main { flex: 1; overflow-y: auto; }
  .content { max-width: 880px; margin: 0 auto; padding: 32px 28px 64px; }
  .api-banner { border: 1px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border-radius: 8px; padding: 10px 14px; font-size: 12.5px; margin-bottom: 20px; }
  .lang-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; }
  .lang-head h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .lang-head p { color: var(--text-secondary); font-size: 13.5px; max-width: 480px; }
  .lang-mastery { text-align: right; flex-shrink: 0; }
  .lang-mastery .pct { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
  .lang-mastery .lbl { font-size: 11.5px; color: var(--text-muted); }
  .mastery-track { width: 120px; height: 5px; border-radius: 3px; background: var(--surface-hover); margin-top: 6px; overflow: hidden; }
  .mastery-fill { height: 100%; background: var(--accent); }
  .category-block { margin-bottom: 26px; }
  .category-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .category-head h3 { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .category-head .cat-progress { font-size: 11.5px; color: var(--text-muted); font-family: var(--font-mono); }
  .concept-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .concept-tile { display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--surface); transition: border-color 0.15s ease, transform 0.1s ease; }
  .concept-tile:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .concept-tile .c-name { font-size: 13px; font-weight: 500; }
  .concept-tile .c-status { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .concept-tile .c-status.strong { background: var(--success); }
  .concept-tile .c-status.review { background: var(--warning); }
  .concept-tile .c-status.new { background: var(--border-strong); }
  @media (max-width: 900px) { .concept-grid { grid-template-columns: 1fr 1fr; } .content { padding: 20px 16px 48px; } }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <h1>Languages</h1>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  </div>
  <div class="body">
    <div class="lang-rail" id="lang-rail"></div>
    <div class="main"><div class="content" id="content"></div></div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_BASE = window.CODRIVE_CONFIG.apiBase;
  const Api = (() => {
    let accessToken = null, currentUser = null;
    async function request(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
      const res = await fetch(API_BASE + path, { ...options, headers, credentials: 'include' });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function getSession() {
      if (currentUser) return currentUser;
      const data = await request('/auth/refresh', { method: 'POST' });
      accessToken = data.accessToken; currentUser = data.user;
      return currentUser;
    }
    async function getLanguages() { return (await request('/languages')).languages; }
    async function getConceptsByCategory(slug, cat) { return (await request(`/concepts/${slug}/${cat}`)).concepts; }
    async function getProgressSummary() { return request('/progress/summary'); }
    return { getSession, getLanguages, getConceptsByCategory, getProgressSummary };
  })();

  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonPath = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  function applyTheme(t) { root.setAttribute('data-theme', t); icon.innerHTML = t === 'dark' ? moonPath : sunPath; }
  { const saved = localStorage.getItem('codrive-theme'); applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); }
  toggle.addEventListener('click', () => { const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(next); localStorage.setItem('codrive-theme', next); });

  const rail = document.getElementById('lang-rail');
  const content = document.getElementById('content');
  let languages = [];
  let conceptsCache = {}; // languageSlug -> { categorySlug: [concepts] }
  let byConceptId = {};
  let masteryByLanguage = {};
  let activeSlug = null;

  function statusFor(rec) {
    if (!rec) return 'new';
    if (rec.lastResult === 'strong') return 'strong';
    return 'review';
  }

  async function loadConceptsFor(lang) {
    if (conceptsCache[lang.slug]) return conceptsCache[lang.slug];
    const byCategory = {};
    for (const cat of lang.categories) {
      try { byCategory[cat.slug] = await Api.getConceptsByCategory(lang.slug, cat.slug); }
      catch (e) { byCategory[cat.slug] = []; }
    }
    conceptsCache[lang.slug] = byCategory;
    return byCategory;
  }

  async function renderLanguage(slug) {
    activeSlug = slug;
    rail.querySelectorAll('.rail-item').forEach(el => el.classList.toggle('active', el.dataset.slug === slug));

    const lang = languages.find(l => l.slug === slug);
    const byCategory = await loadConceptsFor(lang);
    const mastery = Math.round(masteryByLanguage[lang._id] ?? 0);

    content.innerHTML = `
      <div class="lang-head">
        <div><h2>${lang.name}</h2><p>Concepts seeded for this language in your Codrive database.</p></div>
        <div class="lang-mastery"><div class="pct">${mastery}%</div><div class="lbl">mastery</div><div class="mastery-track"><div class="mastery-fill" style="width:${mastery}%"></div></div></div>
      </div>
      ${lang.categories.map(cat => {
        const concepts = byCategory[cat.slug] || [];
        const reviewedCount = concepts.filter(c => byConceptId[c._id]).length;
        return `<div class="category-block">
          <div class="category-head"><h3>${cat.name}</h3><span class="cat-progress">${reviewedCount}/${concepts.length} reviewed</span></div>
          <div class="concept-grid">${concepts.length === 0 ? '<div style="color: var(--text-muted); font-size: 13px;">No concepts seeded in this category yet.</div>' : concepts.map(c => `
            <div class="concept-tile"><span class="c-name">${c.title}</span><span class="c-status ${statusFor(byConceptId[c._id])}"></span></div>
          `).join('')}</div>
        </div>`;
      }).join('')}
    `;
  }

  async function init() {
    try {
      const session = await Api.getSession();
      if (!session) throw new Error('not signed in');
      languages = await Api.getLanguages();
      const stats = await Api.getProgressSummary();
      byConceptId = stats.byConceptId || {};
      (stats.masteryByLanguage || []).forEach(m => { masteryByLanguage[m.languageId] = m.masteryPercent; });

      if (languages.length === 0) {
        content.innerHTML = `<div style="color: var(--text-muted); font-size: 13px;">No languages seeded yet — run <code>npm run seed</code> in codrive-backend.</div>`;
        return;
      }

      rail.innerHTML = languages.map(l => `<div class="rail-item" data-slug="${l.slug}"><span>${l.name}</span><span class="rail-pct">${Math.round(masteryByLanguage[l._id] || 0)}%</span></div>`).join('');
      rail.querySelectorAll('.rail-item').forEach(el => el.addEventListener('click', () => renderLanguage(el.dataset.slug)));
      renderLanguage(languages[0].slug);
    } catch (e) {
      content.innerHTML = `<div style="border:1px solid var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); color: var(--danger); border-radius: 8px; padding: 10px 14px; font-size: 12.5px;">Couldn't reach the Codrive API, or you're not signed in. <a href="codrive-auth.html" style="text-decoration: underline;">Sign in</a> and make sure the backend is running.</div>`;
    }
  }
  init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codrive — Task API</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F7F8; --surface: #FFFFFF; --surface-elevated: #FCFCFD; --surface-hover: #F0F0F1;
    --border: #E4E4E7; --border-strong: #D4D4D8;
    --text-primary: #18181B; --text-secondary: #52525B; --text-muted: #A1A1AA;
    --accent: #2F8F6E; --accent-hover: #267A5D; --accent-tint: rgba(47, 143, 110, 0.09);
    --danger: #C0433C; --danger-tint: rgba(192, 67, 60, 0.09);
    --warning: #B5790C; --success: #2F8F6E;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  html[data-theme="dark"] {
    --bg: #121214; --surface: #1B1B1E; --surface-elevated: #19191C; --surface-hover: #26262A;
    --border: #2C2C30; --border-strong: #38383D;
    --text-primary: #F2F2F3; --text-secondary: #A6A6AC; --text-muted: #6B6B70;
    --accent: #3DB98A; --accent-hover: #4FCB9C; --accent-tint: rgba(61, 185, 138, 0.13);
    --danger: #DB6B64; --danger-tint: rgba(219, 107, 100, 0.12);
    --warning: #D8A23F; --success: #3DB98A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--text-primary); font-family: var(--font-sans); font-size: 13.5px; line-height: 1.5; height: 100vh; overflow: hidden; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input { font-family: inherit; }

  .shell { display: flex; flex-direction: column; height: 100vh; }
  .topbar { height: 44px; flex-shrink: 0; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; background: var(--surface-elevated); }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); }
  .crumbs .cur { color: var(--text-primary); font-weight: 600; }
  .crumbs svg { width: 10px; height: 10px; }
  .topbar-right { display: flex; align-items: center; gap: 6px; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--text-secondary); transition: background 0.12s ease, color 0.12s ease; }
  .icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
  .icon-btn svg { width: 15px; height: 15px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 6px; font-size: 12px; font-weight: 600; transition: background 0.12s ease; white-space: nowrap; }
  .btn svg { width: 12px; height: 12px; }
  .btn-primary { background: var(--text-primary); color: var(--bg); }
  .btn-primary:hover { background: var(--text-secondary); }
  .btn-outline { border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-primary); }
  .btn-outline:hover { background: var(--surface-hover); }

  .workspace { flex: 1; display: flex; min-height: 0; }
  .explorer { width: 220px; flex-shrink: 0; border-right: 1px solid var(--border); background: var(--surface-elevated); overflow-y: auto; padding: 10px 6px; }
  .exp-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 8px; }
  .exp-head span { font-size: 11px; font-weight: 600; color: var(--text-muted); }
  .tree-item { display: flex; align-items: center; gap: 6px; padding: 3.5px 8px; border-radius: 5px; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; }
  .tree-item:hover { background: var(--surface-hover); }
  .tree-item.active { background: var(--accent-tint); color: var(--accent); font-weight: 500; }
  .tree-item svg { width: 13px; height: 13px; flex-shrink: 0; }

  .editor-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .tabbar { display: flex; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface-elevated); overflow-x: auto; flex-shrink: 0; }
  .file-tab { display: flex; align-items: center; gap: 7px; padding: 8px 10px 8px 12px; font-size: 12px; font-family: var(--font-mono); color: var(--text-muted); border-right: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
  .file-tab.active { color: var(--text-primary); background: var(--surface); }

  .editor-body { flex: 1; display: flex; min-height: 0; background: var(--surface); font-family: var(--font-mono); font-size: 13px; line-height: 1.7; }
  .gutter { padding: 10px 10px 10px 14px; text-align: right; color: var(--text-muted); user-select: none; border-right: 1px solid var(--border); background: var(--surface-elevated); white-space: pre; }
  #code { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--text-primary); padding: 10px 14px; font-family: var(--font-mono); font-size: 13px; line-height: 1.7; white-space: pre; overflow: auto; tab-size: 2; }

  .terminal-wrap { height: 150px; flex-shrink: 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  .term-tabs { display: flex; align-items: center; background: var(--surface-elevated); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .term-tab { padding: 7px 14px; font-size: 11.5px; font-weight: 500; color: var(--text-primary); }
  .terminal { flex: 1; background: var(--text-primary); color: var(--bg); font-family: var(--font-mono); font-size: 12px; padding: 10px 14px; overflow-y: auto; }
  html[data-theme="dark"] .terminal { background: #0C0C0D; }
  .term-line { margin-bottom: 3px; }
  .term-line .prompt { opacity: 0.5; margin-right: 6px; }
  .term-line.ok { color: #3DB98A; }
  .term-line.err { color: #EF8C86; }

  .right-pane { width: 240px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--surface-elevated); display: flex; flex-direction: column; }
  .rp-head { padding: 12px 14px 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .rp-head h3 { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
  .rp-head .count { font-size: 11px; font-family: var(--font-mono); color: var(--text-muted); }
  .test-list { flex: 1; overflow-y: auto; padding: 8px; }
  .test-row { display: flex; align-items: flex-start; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  .test-row:hover { background: var(--surface-hover); }
  .test-row svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
  .test-row.pass svg { stroke: var(--success); }
  .test-row.fail svg { stroke: var(--danger); }
  .test-detail { margin: 0 8px 8px; padding: 9px 10px; border-radius: 6px; background: var(--danger-tint); color: var(--danger); font-size: 11.5px; line-height: 1.5; font-family: var(--font-mono); display: none; }
  .test-detail.open { display: block; }
  .rp-foot { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-secondary); }
  .rp-foot strong { color: var(--text-primary); }
  .api-note { padding: 8px 14px; font-size: 11px; color: var(--danger); }

  @media (max-width: 980px) { .explorer, .right-pane { display: none; } }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="crumbs"><span>Projects</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg><span class="cur">Task API</span></div>
    <div class="topbar-right">
      <span id="save-status" style="font-size: 11.5px; color: var(--text-muted);"></span>
      <button class="btn btn-outline" id="save-btn">Save</button>
      <button class="btn btn-primary" id="run-project-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Run</button>
      <button class="icon-btn" id="theme-toggle" aria-label="Toggle theme"><svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    </div>
  </div>

  <div class="workspace">
    <div class="explorer">
      <div class="exp-head"><span>TASK-API</span></div>
      <div id="file-tree"></div>
    </div>

    <div class="editor-col">
      <div class="tabbar" id="tabbar"></div>
      <div class="editor-body">
        <div class="gutter" id="gutter">1</div>
        <textarea id="code" spellcheck="false"></textarea>
      </div>
      <div class="terminal-wrap">
        <div class="term-tabs"><div class="term-tab">Terminal</div></div>
        <div class="terminal" id="terminal">
          <div class="term-line"><span class="prompt">$</span>npm install</div>
          <div class="term-line ok">added 84 packages</div>
        </div>
      </div>
    </div>

    <div class="right-pane">
      <div class="rp-head"><h3>Project tests</h3><span class="count" id="test-count">5 / 6</span></div>
      <div class="test-list" id="test-list"></div>
      <div class="rp-foot" id="rp-foot"><strong>5 / 6</strong> tests passed</div>
      <div class="api-note" id="api-note" style="display:none;">Not connected to the backend — <a href="codrive-auth.html" style="color:inherit;text-decoration:underline;">sign in</a> to save real files.</div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_BASE = window.CODRIVE_CONFIG.apiBase;
  const Api = (() => {
    let accessToken = null, currentUser = null;
    async function request(path, options = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
      if (accessToken) headers['Authorization'] = 'Bearer ' + accessToken;
      const res = await fetch(API_BASE + path, { ...options, headers, credentials: 'include' });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }
    async function getSession() {
      if (currentUser) return currentUser;
      const data = await request('/auth/refresh', { method: 'POST' });
      accessToken = data.accessToken; currentUser = data.user;
      return currentUser;
    }
    async function listProjects() { return (await request('/projects')).projects; }
    async function createProject(title, templateSlug) { return (await request('/projects', { method: 'POST', body: JSON.stringify({ title, templateSlug }) })).project; }
    async function getFiles(projectId) { return (await request(`/projects/${projectId}/files`)).files; }
    async function upsertFile(projectId, path, content) { return request(`/projects/${projectId}/files`, { method: 'PUT', body: JSON.stringify({ path, content }) }); }
    return { getSession, listProjects, createProject, getFiles, upsertFile };
  })();

  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const icon = document.getElementById('theme-icon');
  const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  const moonPath = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  function applyTheme(t) { root.setAttribute('data-theme', t); icon.innerHTML = t === 'dark' ? moonPath : sunPath; }
  { const saved = localStorage.getItem('codrive-theme'); applyTheme(saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')); }
  toggle.addEventListener('click', () => { const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(next); localStorage.setItem('codrive-theme', next); });

  const defaultFiles = {
    'server.ts': `import express from "express";\nimport taskRoutes from "./routes/taskRoutes";\n\nconst app = express();\napp.use(express.json());\napp.use("/tasks", taskRoutes);\n\napp.listen(4000, () => {\n  console.log("server listening on :4000");\n});`,
    'taskController.ts': `export function createTask(req, res) {\n  const task = { id: Date.now(), ...req.body };\n  tasks.push(task);\n  res.status(201).json(task);\n}\n\nexport function updateTask(req, res) {\n  const task = tasks.find(t => t.id == req.params.id);\n  task.save(req.body); // bug: save() does not exist\n  res.json(task);\n}`,
    'Task.ts': `export interface Task {\n  id: number;\n  title: string;\n  done: boolean;\n}`,
    'taskRoutes.ts': `import { Router } from "express";\nimport * as ctrl from "../controllers/taskController";\n\nconst router = Router();\nrouter.post("/", ctrl.createTask);\nrouter.patch("/:id", ctrl.updateTask);\n\nexport default router;`,
    'README.md': `# Task API\n\nA small REST API for creating and tracking tasks.\nRun \`npm run dev\` to start the server on port 4000.`
  };

  let files = {};
  let projectId = null;
  let apiAvailable = false;
  const openTabs = ['server.ts'];
  let activeFile = 'server.ts';

  const code = document.getElementById('code');
  const gutter = document.getElementById('gutter');
  const tabbar = document.getElementById('tabbar');
  const fileTree = document.getElementById('file-tree');

  function updateGutter() { gutter.innerHTML = Array.from({ length: code.value.split('\n').length }, (_, i) => i + 1).join('<br>'); }
  function loadFile(name) {
    activeFile = name;
    code.value = files[name] || '';
    updateGutter();
    fileTree.querySelectorAll('.tree-item').forEach(el => el.classList.toggle('active', el.dataset.file === name));
    renderTabs();
    if (name === 'taskController.ts' || true) evaluateTests();
  }
  function renderTabs() {
    tabbar.innerHTML = openTabs.map(name => `<div class="file-tab${name === activeFile ? ' active' : ''}" data-file="${name}">${name}</div>`).join('');
    tabbar.querySelectorAll('.file-tab').forEach(tab => tab.addEventListener('click', () => loadFile(tab.dataset.file)));
  }
  function renderTree() {
    fileTree.innerHTML = Object.keys(files).map(name => `
      <div class="tree-item${name === activeFile ? ' active' : ''}" data-file="${name}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>${name}
      </div>`).join('');
    fileTree.querySelectorAll('.tree-item').forEach(el => el.addEventListener('click', () => {
      const name = el.dataset.file;
      if (!openTabs.includes(name)) openTabs.push(name);
      loadFile(name);
    }));
  }

  let dirtyFiles = new Set();
  code.addEventListener('input', () => {
    files[activeFile] = code.value;
    dirtyFiles.add(activeFile);
    updateGutter();
    if (activeFile === 'taskController.ts') evaluateTests();
    document.getElementById('save-status').textContent = 'Unsaved changes';
  });
  code.addEventListener('scroll', () => { gutter.scrollTop = code.scrollTop; });

  function evaluateTests() {
    const hasBug = (files['taskController.ts'] || '').includes('.save(');
    const passCount = hasBug ? 5 : 6;
    const rows = [
      { name: 'User registration', pass: true },
      { name: 'Login', pass: true },
      { name: 'Create task', pass: true },
      { name: 'Get tasks', pass: true },
      { name: 'Update task', pass: !hasBug, detail: 'Expected 200, received 500 at PATCH /tasks/:id — task.save is not a function' },
      { name: 'Delete task', pass: true },
    ];
    document.getElementById('test-list').innerHTML = rows.map((r, i) => `
      <div class="test-row ${r.pass ? 'pass' : 'fail'}" data-i="${i}"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${r.pass ? '<path d="M20 6L9 17l-5-5"/>' : '<path d="M18 6L6 18M6 6l12 12"/>'}</svg><span>${r.name}</span></div>
      ${r.detail && !r.pass ? `<div class="test-detail" id="detail-${i}">${r.detail}</div>` : ''}
    `).join('');
    document.querySelectorAll('.test-row').forEach(row => {
      const detail = document.getElementById('detail-' + row.dataset.i);
      if (detail) row.addEventListener('click', () => detail.classList.toggle('open'));
    });
    document.getElementById('test-count').textContent = `${passCount} / 6`;
    document.getElementById('rp-foot').innerHTML = `<strong>${passCount} / 6</strong> tests passed`;
  }

  async function saveAll() {
    if (!apiAvailable) { document.getElementById('save-status').textContent = 'Not signed in — nothing saved'; return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    document.getElementById('save-status').textContent = 'Saving…';
    try {
      for (const path of dirtyFiles) {
        await Api.upsertFile(projectId, path, files[path]);
      }
      dirtyFiles.clear();
      document.getElementById('save-status').textContent = 'Saved to your account';
    } catch (e) {
      document.getElementById('save-status').textContent = 'Save failed: ' + e.message;
    }
    btn.disabled = false;
  }
  document.getElementById('save-btn').addEventListener('click', saveAll);
  document.getElementById('run-project-btn').addEventListener('click', () => {
    const terminal = document.getElementById('terminal');
    const line = document.createElement('div');
    line.className = 'term-line ok';
    line.innerHTML = '<span class="prompt">$</span>server listening on :4000';
    terminal.appendChild(line);
    terminal.scrollTop = terminal.scrollHeight;
    evaluateTests();
  });

  async function init() {
    try {
      const session = await Api.getSession();
      if (!session) throw new Error('not signed in');

      let projects = await Api.listProjects();
      let project = projects.find(p => p.title === 'Task API');
      if (!project) project = await Api.createProject('Task API', 'rest-api-express');
      projectId = project._id;

      const remoteFiles = await Api.getFiles(projectId);
      if (remoteFiles.length === 0) {
        // First time opening this project — seed it with the starter files,
        // written for real via PUT so they exist as actual ProjectFile
        // documents from here on, not just in-memory defaults.
        for (const [path, content] of Object.entries(defaultFiles)) {
          await Api.upsertFile(projectId, path, content);
        }
        files = { ...defaultFiles };
      } else {
        remoteFiles.forEach(f => { files[f.path] = f.content; });
      }
      apiAvailable = true;
      document.getElementById('api-note').style.display = 'none';
    } catch (e) {
      files = { ...defaultFiles };
      apiAvailable = false;
      document.getElementById('api-note').style.display = 'block';
    }
    renderTree();
    loadFile('server.ts');
  }
  init();

  window.addEventListener('beforeunload', (e) => {
    if (dirtyFiles.size > 0) { e.preventDefault(); e.returnValue = ''; }
  });
</script>

</body>
</html>
